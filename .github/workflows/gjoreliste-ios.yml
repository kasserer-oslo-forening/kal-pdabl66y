# Bygger iPhone-appen Gjøreliste i skyen og sender den til TestFlight.
# Kjører når noe i gjoreliste-ios/ endres på main, eller manuelt (Actions → «Gjøreliste iOS → TestFlight» → Run workflow).
#
# Trenger disse hemmelighetene (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      Key ID for App Store Connect API-nøkkelen
#   ASC_ISSUER_ID   Issuer ID (står øverst på siden med API-nøkler)
#   ASC_KEY_P8      Hele innholdet i .p8-fila (fra -----BEGIN PRIVATE KEY----- til -----END PRIVATE KEY-----)
#   APPLE_TEAM_ID   Team ID for det betalte Apple Developer-medlemskapet (10 tegn)

name: Gjøreliste iOS → TestFlight

on:
  push:
    branches: [main]
    paths:
      - "gjoreliste-ios/**"
      - ".github/workflows/gjoreliste-ios.yml"
  workflow_dispatch:

concurrency:
  group: gjoreliste-ios
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PROJECT: gjoreliste-ios/Gjoreliste.xcodeproj
      SCHEME: Gjoreliste
    steps:
      - uses: actions/checkout@v4

      - name: Sett stier
        run: |
          echo "ARCHIVE=$RUNNER_TEMP/Gjoreliste.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_DIR=$RUNNER_TEMP/export" >> "$GITHUB_ENV"
          echo "KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Sjekk at hemmelighetene finnes
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mangler=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!v}" ] || mangler="$mangler $v"
          done
          if [ -n "$mangler" ]; then
            echo "::error::Mangler hemmeligheter:$mangler. Legg dem inn under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Velg nyeste Xcode 26 eller nyere
        run: |
          XC=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "::error::Fant ingen Xcode 26 eller nyere på byggemaskinen. Tilgjengelig:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Legg API-nøkkelen på plass
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

      - name: Bygg arkiv (signeres automatisk i skyen)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*(sign|provision)|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d "$ARCHIVE" || { echo "::error::Arkivet ble ikke laget. Se loggen over (og archive.log i artefaktene)."; exit 1; }

      - name: Last opp til TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$EXPORT_DIR" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          echo "### Byggnummer ${{ github.run_number }} er sendt til TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "Det tar vanligvis 5–20 minutter før det dukker opp i TestFlight-appen på iPhonen." >> "$GITHUB_STEP_SUMMARY"

      - name: Lagre logger ved feil
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: byggelogger
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore

      - name: Slett API-nøkkelen
        if: always()
        run: rm -f "$KEY_PATH"
